# Signed AAB for every branch other than prod, including main, uploaded only to
# Google Play Internal App Sharing. Does not create an internal, alpha, beta,
# or production release. Workers Builds does not run this job.

name: Android Internal Sharing

on:
  push:
    branches-ignore:
      - prod
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  statuses: write

concurrency:
  group: android-internal-sharing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  internal-sharing:
    if: github.ref != 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ~/Android/Sdk
          key: android-sdk-36.1.0-${{ runner.os }}

      - name: Build signed AAB and upload to Internal App Sharing
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_PREVIEW_METADATA_OUT: ${{ github.workspace }}/android-preview.json
        run: bash scripts/android-play-internal.sh

      - name: Record the install link
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f android-preview.json
          URL="$(jq -r '.downloadUrl' android-preview.json)"
          VERSION="$(jq -r '.versionName' android-preview.json)"
          test -n "$URL" && test "$URL" != "null"
          DESC="Internal App Sharing ${VERSION}"
          DESC="${DESC:0:140}"
          {
            echo "### Internal App Sharing"
            echo
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Version: \`${VERSION}\`"
            echo "- Install: ${URL}"
          } >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context="play/internal-sharing" \
            -f target_url="$URL" \
            -f description="$DESC"

      - name: Upload preview metadata and AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-internal-sharing
          if-no-files-found: error
          path: |
            android-preview.json
            android/app-release-bundle.aab
