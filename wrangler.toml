name = "ksiag"
account_id = "86e0b7dbeec0ebfff2333c8e8c4087fb"
main = "worker/src/index.ts"
compatibility_date = "2025-10-01"
workers_dev = true
# Worker Previews on workers.dev as well as the custom domain below.
preview_urls = true

# Workers Builds (Cloudflare app on Cursor Origin) reads this file.
# It does not read a build command from here. In the app:
#   production branch: main
#   build command:     npm run build
#   deploy command:    npx wrangler deploy
#   preview command:   npx wrangler preview
# Pushes to main deploy production. Every other branch, including dev,
# runs wrangler preview and does not take the production routes.

# Istniejące rekordy DNS na apex i www — Routes, nie Custom Domain.
[[routes]]
pattern = "66ksiag.pl/*"
zone_name = "66ksiag.pl"

[[routes]]
pattern = "www.66ksiag.pl/*"
zone_name = "66ksiag.pl"

# Preview-only custom domain. enabled = false keeps production off this host.
# wrangler preview cannot publish the apex https://devpreview.66ksiag.pl.
# It always inserts the branch name: https://dev.devpreview.66ksiag.pl
# A wildcard on *.66ksiag.pl would also cover www.66ksiag.pl, so that parent
# is not used.
[[routes]]
pattern = "devpreview.66ksiag.pl"
custom_domain = true
previews_enabled = true
enabled = false

# Postęp planu: identyfikator slotu → szyfrogram ≤ 64 B.
# Odczyt i zapis wymagają podpisu Ed25519. Klucz publiczny leży pod pub:{id}.
[[kv_namespaces]]
binding = "SYNC"
id = "99a40bb27a764d839669293aea208e8f"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"

# Previews do not inherit production bindings. Leave SYNC off this block so a
# preview cannot read or write the production KV namespace. Routes and cron
# triggers are not valid here; the preview hostname is the route above.
[previews]
