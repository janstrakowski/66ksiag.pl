buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        if (System.getenv("KSIAG_PARITY") == "1") {
            classpath "app.cash.paparazzi:paparazzi-gradle-plugin:2.0.0-alpha05.1"
        }
    }
}

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace = "pl.ksiag.app"
    compileSdk = 36

    defaultConfig {
        applicationId = "pl.ksiag.app"
        minSdk = 26
        targetSdk = 36
        def rawVersionCode = project.findProperty("ksiagVersionCode")?.toString()?.trim()
            ?: System.getenv("KSIAG_VERSION_CODE")?.trim()
            ?: System.getenv("ANDROID_VERSION_CODE")?.trim()
        def resolvedVersionCode = (rawVersionCode && rawVersionCode.isInteger())
            ? rawVersionCode.toInteger()
            : 2
        if (resolvedVersionCode < 1 || resolvedVersionCode > 2100000000) {
            throw new GradleException("Invalid Android versionCode: ${resolvedVersionCode}")
        }
        def resolvedVersionName = project.findProperty("ksiagVersionName")?.toString()?.trim()
            ?: System.getenv("KSIAG_VERSION_NAME")?.trim()
            ?: System.getenv("ANDROID_VERSION_NAME")?.trim()
            ?: "2.0.0"
        versionCode = resolvedVersionCode
        versionName = resolvedVersionName
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose = true
    }

    buildTypes {
        debug {
            // Obok aplikacji z Play (inny podpis). Release zostaje pl.ksiag.app.
            applicationIdSuffix = ".debug"
        }
        release {
            minifyEnabled = false
        }
    }
}

def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")?.trim()
    ?: System.getenv("KEYSTORE_FILE")?.trim()
    ?: "android.keystore"
def ksFile = new File(ksPath)
if (!ksFile.isAbsolute()) {
    ksFile = rootProject.file(ksPath)
}
def ksPass = System.getenv("ANDROID_KEYSTORE_PASSWORD")?.trim()
    ?: System.getenv("KEYSTORE_PASSWORD")?.trim()
    ?: ""
def keyPass = System.getenv("ANDROID_KEY_PASSWORD")?.trim()
    ?: System.getenv("KEY_PASSWORD")?.trim()
    ?: ksPass
def alias = System.getenv("ANDROID_KEY_ALIAS")?.trim()
    ?: System.getenv("KEY_ALIAS")?.trim()
    ?: "android"
if (ksFile.exists() && ksPass) {
    android.signingConfigs {
        release {
            storeFile ksFile
            storePassword ksPass
            keyAlias alias
            keyPassword keyPass
        }
    }
    android.buildTypes.release.signingConfig android.signingConfigs.release
}

dependencies {
    def composeBom = platform("androidx.compose:compose-bom:2025.02.00")
    implementation composeBom

    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"

    implementation "androidx.activity:activity-compose:1.10.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation "androidx.core:core-ktx:1.15.0"

    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "androidx.media3:media3-exoplayer:1.5.1"
    implementation "androidx.media3:media3-session:1.5.1"
    implementation "com.caverock:androidsvg-aar:1.4"
    implementation "net.i2p.crypto:eddsa:0.3.0"
    implementation "com.google.zxing:core:3.5.3"
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"

    testImplementation "junit:junit:4.13.2"
}

if (System.getenv("KSIAG_PARITY") == "1") {
    apply plugin: "app.cash.paparazzi"
    android.sourceSets.test.java.srcDir("src/parity/java")
}

// Bundle chapter JSON + books.json + audio catalog into APK assets (from repo data/).
def repoRoot = rootProject.projectDir.parentFile
def dataDir = new File(repoRoot, "data")
def catalogSrc = new File(repoRoot, "web/audio-catalog.json")
def bibleAssetsDir = new File(projectDir, "src/main/assets/bible")
def catalogAsset = new File(projectDir, "src/main/assets/audio-catalog.json")

tasks.register("syncBibleAssets") {
    inputs.dir(dataDir)
    inputs.file(catalogSrc)
    outputs.dir(bibleAssetsDir)
    outputs.file(catalogAsset)
    doLast {
        if (!dataDir.isDirectory()) {
            throw new GradleException(
                "Missing data/ at ${dataDir}. Symlink or populate Bible JSON before building the Android app.",
            )
        }
        if (!catalogSrc.isFile()) {
            throw new GradleException("Missing ${catalogSrc}")
        }
        delete(bibleAssetsDir)
        bibleAssetsDir.mkdirs()
        ["bg/1879", "kjv/1769"].each { ed ->
            def srcEd = new File(dataDir, ed)
            def destEd = new File(bibleAssetsDir, ed)
            if (!srcEd.isDirectory()) {
                throw new GradleException("Missing edition data at ${srcEd}")
            }
            destEd.mkdirs()
            def booksJson = new File(srcEd, "books.json")
            if (!booksJson.isFile()) throw new GradleException("Missing ${booksJson}")
            ant.copy(file: booksJson, tofile: new File(destEd, "books.json"))
            srcEd.eachDir { bookDir ->
                def bookDest = new File(destEd, bookDir.name)
                bookDest.mkdirs()
                bookDir.eachFile { f ->
                    if (f.name ==~ /^\d+\.json$/) {
                        ant.copy(file: f, tofile: new File(bookDest, f.name))
                    }
                }
            }
        }
        ant.copy(file: catalogSrc, tofile: catalogAsset)
    }
}

tasks.named("preBuild").configure { dependsOn("syncBibleAssets") }
