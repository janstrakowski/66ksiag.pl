name = "66ksiag"
account_id = "86e0b7dbeec0ebfff2333c8e8c4087fb"
main = "worker/src/index.ts"
compatibility_date = "2025-10-01"
workers_dev = true
# Worker Previews on workers.dev as well as <branch>.66ksiag.pl.
preview_urls = true

# Workers Builds does not read a build command from this file. The deploy
# command does: `npx wrangler deploy` runs [build] before upload, so a push
# still publishes the site when the dashboard build command is empty.
# In the app, production branch must be main.
#   build command:     npm run build
#   deploy command:    npx wrangler deploy
#   preview command:   npx wrangler preview
# Pushes to main deploy production. Every other branch, including dev,
# runs wrangler preview and does not take the production routes.
# npm install patches wrangler 4.149 so Git LFS pointer MP3s upload as
# Static Assets under the hashes in audio-assets-manifest.json.

[build]
command = "bash scripts/build-dist.sh"

# Apex i www zostają trasami strefy. To nie są Custom Domains.
[[routes]]
pattern = "66ksiag.pl/*"
zone_name = "66ksiag.pl"

[[routes]]
pattern = "www.66ksiag.pl/*"
zone_name = "66ksiag.pl"

# Preview hostnames are <branch>.66ksiag.pl. enabled = false so this custom
# domain does not receive production traffic. Branch dev:
# https://dev.66ksiag.pl
# This creates a wildcard hostname. Delete the DNS A record
# *.66ksiag.pl → 85.128.128.104 first. Cloudflare will not replace that
# externally managed wildcard (error 100117). Leave MX and TXT in place.
[[routes]]
pattern = "66ksiag.pl"
custom_domain = true
previews_enabled = true
enabled = false

# Postęp planu: identyfikator slotu → szyfrogram ≤ 64 B.
# Odczyt i zapis wymagają podpisu Ed25519. Klucz publiczny leży pod pub:{id}.
[[kv_namespaces]]
binding = "SYNC"
id = "99a40bb27a764d839669293aea208e8f"

# Chapter MP3s are Static Assets. They are not routed through the Worker.
# Previews do not inherit SYNC, so a branch preview cannot read or write
# the production KV namespace.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
run_worker_first = ["/api/*", "/sw.js", "/manifest.webmanifest"]
