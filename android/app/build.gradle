buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        if (System.getenv("KSIAG_PARITY") == "1") {
            classpath "app.cash.paparazzi:paparazzi-gradle-plugin:2.0.0-alpha05.1"
        }
    }
}

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace = "pl.ksiag.app"
    compileSdk = 36

    defaultConfig {
        applicationId = "pl.ksiag.app"
        minSdk = 26
        targetSdk = 36
        versionCode = 2
        versionName = "2.0.0"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose = true
    }

    buildTypes {
        debug {
            // Obok aplikacji z Play (inny podpis). Release zostaje pl.ksiag.app.
            applicationIdSuffix = ".debug"
        }
        release {
            minifyEnabled = false
        }
    }
}

def ksFile = rootProject.file("android.keystore")
def ksPass = System.getenv("KEYSTORE_PASSWORD") ?: ""
def keyPass = System.getenv("KEY_PASSWORD") ?: ksPass
def alias = System.getenv("KEY_ALIAS") ?: "android"
if (ksFile.exists() && ksPass) {
    android.signingConfigs {
        release {
            storeFile ksFile
            storePassword ksPass
            keyAlias alias
            keyPassword keyPass
        }
    }
    android.buildTypes.release.signingConfig android.signingConfigs.release
}

dependencies {
    def composeBom = platform("androidx.compose:compose-bom:2025.02.00")
    implementation composeBom

    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"

    implementation "androidx.activity:activity-compose:1.10.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation "androidx.core:core-ktx:1.15.0"

    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "androidx.media3:media3-exoplayer:1.5.1"
    implementation "androidx.media3:media3-session:1.5.1"
    implementation "com.caverock:androidsvg-aar:1.4"
    implementation "net.i2p.crypto:eddsa:0.3.0"
    implementation "com.google.zxing:core:3.5.3"
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"

    testImplementation "junit:junit:4.13.2"
}

if (System.getenv("KSIAG_PARITY") == "1") {
    apply plugin: "app.cash.paparazzi"
    android.sourceSets.test.java.srcDir("src/parity/java")
}
